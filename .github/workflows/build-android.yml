name: Build Android APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:

concurrency:
  group: kbrowser-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    name: Validate candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell and pinned upstream
        shell: bash
        run: |
          for script in scripts/*.sh; do sh -n "$script"; done
          ./scripts/check-ci-config.sh

  build:
    name: Build arm64 APK
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate candidate
        run: ./scripts/check-ci-config.sh

      - name: Install required Android SDK pieces
        working-directory: browser
        run: ./automation/iceraven/install-sdk.sh

      - name: Prepare upstream and KBrowser patches
        shell: bash
        run: |
          (cd browser && ./automation/iceraven/patch_android_components.sh)
          ./scripts/apply-patches.sh "$GITHUB_WORKSPACE/browser"
          printf '%s\n' 'autosignReleaseWithDebugKey=' > browser/local.properties

      - name: Apply Iceraven resource branding
        shell: bash
        working-directory: browser
        run: |
          sed -i 's/Firefox/Iceraven/g' app/src/*/res/values*/*strings.xml
          sed -i '/about_content/s/Mozilla/@forkmaintainers/' app/src/*/res/values*/*strings.xml
          sed -i '/<string name="trackers_blocked_panel_categorical_num_trackers_blocked">/s/%s/%1$s/g; /<string name="trackers_blocked_panel_categorical_num_trackers_blocked">/s/%d/%2$d/g' app/src/*/res/values*/*strings.xml

      - name: Compile release APKs
        shell: bash
        working-directory: browser
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-XX:MaxMetaspaceSize=2g -Xms1g -Xmx6g -XX:+HeapDumpOnOutOfMemoryError"
        run: |
          set -o pipefail
          VERSION_NAME="$(git describe --tags --always)"
          ./gradlew app:assembleForkRelease -PversionName="$VERSION_NAME" --stacktrace --no-daemon 2>&1 | tee ../compile.log || {
            grep -E '(^e: |^w: | warning: | error: |What went wrong|Unresolved reference|Cannot access|overrides nothing)' ../compile.log \
              | tail -80 \
              | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Collect candidate
        shell: bash
        run: |
          mkdir -p artifacts
          find browser -type f -path '*/outputs/apk/*' -iname '*.apk' -print
          APK_PATH="$(find browser -type f -path '*/outputs/apk/*' -iname '*arm64-v8a*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            APK_PATH="$(find browser -type f -path '*/outputs/apk/*' -iname '*.apk' -print -quit)"
          fi
          test -n "$APK_PATH"
          echo "Collecting $APK_PATH"
          cp "$APK_PATH" artifacts/KBrowser-arm64.apk
          keytool -genkeypair -noprompt \
            -keystore /tmp/kbrowser-ci-test.jks \
            -storepass android -keypass android \
            -alias kbrowser-test -dname "CN=KBrowser CI Test" \
            -keyalg RSA -keysize 2048 -validity 10000
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks /tmp/kbrowser-ci-test.jks \
            --ks-pass pass:android --key-pass pass:android \
            artifacts/KBrowser-arm64.apk
          "$APKSIGNER" verify --verbose artifacts/KBrowser-arm64.apk
          sha256sum artifacts/KBrowser-arm64.apk > artifacts/KBrowser-arm64.apk.sha256
          printf '%s\n' "repository=$GITHUB_REPOSITORY" "commit=$GITHUB_SHA" > artifacts/manifest.txt
          cat build/upstream.env >> artifacts/manifest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: KBrowser-arm64-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Publish installable prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-${{ github.sha }}
          name: KBrowser CI ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: |
            artifacts/KBrowser-arm64.apk
            artifacts/KBrowser-arm64.apk.sha256
            artifacts/manifest.txt
